<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grip — Join me</title>
  <meta name="robots" content="noindex" />
  <!-- Absolute paths only: this file is served for arbitrary URLs like /i/abc_1234,
       so relative asset paths would resolve against the wrong directory. -->
  <link rel="icon" type="image/svg+xml" href="/brand/logo/grip-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fairway: #2F5D4A;
      --fairway-2: #24493A;
      --cream: #F4EEE0;
      --cream-2: #FAF6EC;
      --ink: #1A1F1C;
      --ink-55: rgba(26, 31, 28, 0.55);
      --ink-12: rgba(26, 31, 28, 0.12);
      --sunset: #C66B4A;
      --display: 'Fraunces', ui-serif, Georgia, serif;
      --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--cream-2);
      border: 1px solid var(--ink-12);
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
    }
    .wordmark { height: 26px; margin-bottom: 32px; }
    h1 {
      font-family: var(--display);
      font-weight: 500;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }
    p.lead { font-size: 16px; line-height: 1.55; color: var(--ink-55); margin-bottom: 28px; }
    .code-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: var(--cream);
      border: 1px solid var(--ink-12);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 8px;
    }
    .copied { font-size: 13px; color: var(--fairway); height: 18px; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary { background: var(--fairway); color: var(--cream); }
    .btn-primary:hover { background: var(--fairway-2); }
    .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--ink-12); }
    .store-row { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .soon {
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--ink-55);
      margin-top: 24px;
    }
    .foot { margin-top: 28px; font-size: 13px; }
    .foot a { color: var(--fairway); text-decoration: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="wordmark" src="/brand/logo/grip-wordmark.svg" alt="Grip" />

    <!-- Invite view -->
    <div id="invite" class="hidden">
      <h1 id="invite-title">A friend invited you to Grip</h1>
      <p class="lead">Find playing partners, book tee times, and start your golfing adventure.</p>

      <div id="code-block" class="hidden">
        <div class="code-chip"><span id="code-text"></span></div>
        <div class="copied" id="copied-msg"></div>
      </div>

      <a class="btn btn-secondary" id="open-app">Open in Grip</a>

      <div class="store-row" id="store-row">
        <!-- Store buttons injected here when URLs are configured -->
      </div>
      <p class="soon" id="soon-msg">Grip is launching soon in the UK App Store.</p>
    </div>

    <!-- Generic not-found view -->
    <div id="notfound" class="hidden">
      <h1>Page not found</h1>
      <p class="lead">That link doesn't lead anywhere on Grip.</p>
      <a class="btn btn-primary" href="/">Go to gripgolfapp.com</a>
    </div>

    <div class="foot">
      <a href="/">gripgolfapp.com</a>
    </div>
  </main>

  <script>
    // ----- Fill these in as store listings go live; empty = "coming soon" -----
    var APP_STORE_URL = '';     // e.g. https://apps.apple.com/app/idXXXXXXXXX
    var PLAY_STORE_URL = '';    // e.g. https://play.google.com/store/apps/details?id=com.gripgolfapp.app
    var TESTFLIGHT_URL = '';    // optional public TestFlight link during beta
    // -------------------------------------------------------------------------

    (function () {
      var path = decodeURIComponent(window.location.pathname || '');
      // Match /i/CODE or /invite/CODE (trailing slash optional)
      var m = path.match(/^\/(?:i|invite)\/([^\/?#]+)/i);
      var deepPath = path.replace(/^\//, ''); // e.g. "profile/123" or "tee-time/9"
      var isAppPath = /^(?:profile|tee-time)\//i.test(deepPath);

      if (m) {
        var code = m[1].toLowerCase();
        showInvite(code);
      } else if (isAppPath) {
        // Profile / tee-time share links — offer to open the app, no code.
        showInvite(null, deepPath);
      } else {
        document.getElementById('notfound').classList.remove('hidden');
      }
    })();

    function showInvite(code, appPath) {
      document.getElementById('invite').classList.remove('hidden');

      // "Open in Grip" tries the app via its custom scheme (works if installed).
      var scheme = code ? ('grip://invite/' + code) : ('grip://' + (appPath || ''));
      document.getElementById('open-app').setAttribute('href', scheme);

      if (code) {
        document.getElementById('code-block').classList.remove('hidden');
        document.getElementById('code-text').textContent = code;
        // Copy to clipboard so a fresh install can pick it up on first launch
        // (deferred attribution). Best-effort; silent if blocked.
        try {
          navigator.clipboard.writeText(code).then(function () {
            document.getElementById('copied-msg').textContent = 'Invite code copied';
          }).catch(function () {});
        } catch (e) {}
      } else {
        document.getElementById('invite-title').textContent = 'Open this in Grip';
      }

      buildStoreButtons();
    }

    function buildStoreButtons() {
      var row = document.getElementById('store-row');
      var added = false;
      function add(label, url) {
        var a = document.createElement('a');
        a.className = 'btn btn-primary';
        a.textContent = label;
        a.href = url;
        row.appendChild(a);
        added = true;
      }
      if (APP_STORE_URL) add('Download on the App Store', APP_STORE_URL);
      else if (TESTFLIGHT_URL) add('Join the TestFlight beta', TESTFLIGHT_URL);
      if (PLAY_STORE_URL) add('Get it on Google Play', PLAY_STORE_URL);

      // If a real store/beta link exists, drop the "coming soon" note.
      if (added) document.getElementById('soon-msg').classList.add('hidden');
    }
  </script>
</body>
</html>
