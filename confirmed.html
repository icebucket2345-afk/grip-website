<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed - Grip</title>
  <style>
    :root {
      --bg: #F4EEE0;
      --card: #EAE1CB;
      --text: #1A1F1C;
      --text-muted: rgba(26, 31, 28, 0.70);
      --green: #2F5D4A;
      --border: rgba(26, 31, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(47, 93, 74, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .badge svg { width: 34px; height: 34px; stroke: var(--green); }
    h1 { font-size: 22px; margin: 0 0 12px; color: var(--green); }
    p { font-size: 15px; line-height: 1.5; color: var(--text-muted); margin: 0 0 8px; }
    .hint { margin-top: 20px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>
    <h1>Email confirmed</h1>
    <p>Your Grip account is verified.</p>
    <p class="hint">Return to the Grip app and sign in to get started.</p>
  </main>
</body>
</html>
